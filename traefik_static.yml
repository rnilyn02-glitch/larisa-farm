global:
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: rnilyn@mail.ru
      storage: /acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    filename: /traefik_dynamic.yml
    watch: true

log:
  level: INFO
